<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Signature Music — Music Player</title>
  <meta id="metaDescription" name="description" content="Listen, discover, and enjoy your music with Signature Music." />
  <meta name="theme-color" content="#0b0b12" />
  <meta name="color-scheme" content="dark light" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link id="canonicalLink" rel="canonical" href="https://signature-music.vercel.app/" />

  <meta id="ogTitle" property="og:title" content="Signature Music — Music Player" />
  <meta id="ogDescription" property="og:description" content="Listen, discover, and enjoy your music." />
  <meta id="ogImage" property="og:image" content="https://i.postimg.cc/W3pHjGCQ/fragmen.webp" />
  <meta id="ogUrl" property="og:url" content="https://signature-music.vercel.app/" />
  <meta property="og:type" content="music.playlist" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta id="twTitle" name="twitter:title" content="Signature Music — Music Player" />
  <meta id="twDescription" name="twitter:description" content="Listen, discover, and enjoy your music." />
  <meta id="twImage" name="twitter:image" content="https://i.postimg.cc/W3pHjGCQ/fragmen.webp" />

  <link rel="icon" type="image/webp" href="https://i.postimg.cc/VLrVFjF1/haieresignaturebiru.webp" />
  <link rel="apple-touch-icon" href="https://i.postimg.cc/W3pHjGCQ/fragmen.webp" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://files.catbox.moe" crossorigin />
  <link rel="preconnect" href="https://i.postimg.cc" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />

  <script>
    (function () {
      try {
        var t = localStorage.getItem('sig_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var lang = localStorage.getItem('sig_lang');
        if (lang === 'id' || lang === 'en') document.documentElement.lang = lang;
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- ========== SKELETON ========== -->
  <div id="skeleton" class="skeleton-screen" role="status" aria-busy="true" aria-live="polite" aria-label="Loading">
    <div class="sk-topbar">
      <div class="sk sk-logo"></div>
      <div class="sk sk-pill"></div>
    </div>
    <div class="sk-layout">
      <div class="sk-sidebar">
        <div class="sk sk-nav"></div>
        <div class="sk sk-nav"></div>
        <div class="sk sk-nav"></div>
      </div>
      <div class="sk-main">
        <div class="sk sk-hero"></div>
        <div class="sk sk-title"></div>
        <div class="sk sk-sub"></div>
        <div class="sk sk-cards">
          <div class="sk sk-card"></div>
          <div class="sk sk-card"></div>
          <div class="sk sk-card"></div>
        </div>
        <div class="sk sk-list"></div>
        <div class="sk sk-list"></div>
      </div>
    </div>
    <div class="sk-playerbar">
      <div class="sk sk-art"></div>
      <div class="sk sk-meta"></div>
      <div class="sk sk-pill"></div>
    </div>
    <span class="sr-only" data-i18n="common.loading">Loading…</span>
  </div>

  <!-- ========== APP ========== -->
  <div id="app" class="app">
    <header class="topbar">
      <button class="brand" id="brandBtn" data-action="brand" aria-label="Signature Music">
        <img src="https://i.postimg.cc/W3pHjGCQ/fragmen.webp" alt="" width="32" height="32" />
        <span class="brand-name">Signature <strong>Music</strong></span>
      </button>
      <div class="topbar-actions">
        <button class="icon-btn" data-action="cycle-theme" data-i18n-aria="settings.theme" aria-label="Theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="lang-btn" data-action="toggle-language" data-i18n-aria="settings.language" aria-label="Language">
          <span id="langLabel">EN</span>
        </button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" aria-label="Main navigation">
        <nav class="side-nav">
          <a href="/" data-nav="home" class="nav-link" data-i18n="nav.home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
            Home
          </a>
          <a href="/music" data-nav="music" class="nav-link" data-i18n="nav.music">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            Music
          </a>
          <a href="/settings" data-nav="settings" class="nav-link" data-i18n="nav.settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            Settings
          </a>
        </nav>
        <div class="sidebar-footer">
          <a class="support-link" href="https://buymeacoffee.com/hajirstudio" target="_blank" rel="noopener noreferrer" data-i18n="common.support">Support</a>
          <span class="version">V3.0.0</span>
        </div>
      </aside>

      <main id="viewRoot" class="view-root"></main>
    </div>

    <!-- ========== PLAYER BAR ========== -->
    <div id="playerBar" class="player-bar" aria-label="Player controls">
      <div class="player-track">
        <img id="pbArt" class="pb-art" alt="" width="48" height="48" loading="lazy" decoding="async" />
        <div class="pb-meta">
          <span id="pbTitle" class="pb-title">—</span>
          <span id="pbArtist" class="pb-artist">—</span>
        </div>
      </div>
      <div class="player-center">
        <div class="player-controls">
          <button id="btnShuffle" class="icon-btn small" data-action="toggle-shuffle" data-i18n-aria="player.shuffle" aria-label="Shuffle" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          </button>
          <button id="btnPrev" class="icon-btn small" data-action="prev" data-i18n-aria="player.previous" aria-label="Previous">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
          </button>
          <button id="btnPlay" class="play-btn" data-action="toggle-play" data-i18n-aria="player.play" aria-label="Play" aria-pressed="false">
            <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
          </button>
          <button id="btnNext" class="icon-btn small" data-action="next" data-i18n-aria="player.next" aria-label="Next">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </button>
          <button id="btnRepeat" class="icon-btn small" data-action="toggle-repeat" data-i18n-aria="player.repeat" aria-label="Repeat" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>
        </div>
        <div class="player-progress">
          <span id="pbCurrent">0:00</span>
          <div id="pbProgress" class="progress-track" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="pbProgressFill" class="progress-fill"></div>
          </div>
          <span id="pbDuration">0:00</span>
        </div>
      </div>
      <div class="player-right">
        <button id="btnMute" class="icon-btn small" data-action="toggle-mute" data-i18n-aria="player.mute" aria-label="Mute" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <input id="pbVolume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume" />
      </div>
    </div>

    <!-- ========== MOBILE NAV ========== -->
    <nav class="bottom-nav" aria-label="Mobile navigation">
      <a href="/" data-nav="home" class="bottom-link" data-i18n="nav.home">Home</a>
      <a href="/music" data-nav="music" class="bottom-link" data-i18n="nav.music">Music</a>
      <a href="/settings" data-nav="settings" class="bottom-link" data-i18n="nav.settings">More</a>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modalRoot"></div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <noscript>
    <p style="padding:24px;text-align:center;font-family:sans-serif">
      Signature Music requires JavaScript to play music.
    </p>
  </noscript>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
